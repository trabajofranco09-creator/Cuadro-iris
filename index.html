<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iris - Goo Goo Dolls</title>
    <style>
        :root {
            --bg-color: #0f1016;
            --primary-pink: #e06d7d;
            --text-main: #fcf8f2;
            --text-muted: #888d9c;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            position: relative;
            color: var(--text-main);
            user-select: none;
        }

        /* Pantalla de inicio inicial con el botón solicitado */
        .welcome-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--bg-color);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            gap: 20px;
        }

        .start-btn {
            background-color: var(--primary-pink);
            color: white;
            border: none;
            padding: 14px 28px;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            font-size: 15px;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(224, 109, 125, 0.4);
            transition: background 0.2s;
        }

        .start-btn:hover {
            background-color: #c95a6b;
        }

        /* Contenedor principal de la letra y controles */
        .player-container {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 35px;
            z-index: 2;
            width: 90%;
            max-width: 600px;
        }

        .song-header {
            font-size: 11px;
            letter-spacing: 3px;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        /* Visualizador de letras dinámico */
        .lyrics-display {
            font-size: 26px;
            font-weight: bold;
            color: var(--text-main);
            min-height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            line-height: 1.4;
            transition: opacity 0.2s ease-in-out;
            padding: 0 10px;
        }

        /* Controles de reproducción */
        .controls {
            display: flex;
            gap: 15px;
            justify-content: center;
        }

        .control-btn {
            background: #1c1f2b;
            border: 1px solid #2a2d3d;
            color: white;
            padding: 8px 20px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 12px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .control-btn:hover {
            background: #2a2d3d;
        }

        .control-btn.active {
            background: var(--primary-pink);
            border-color: var(--primary-pink);
        }

        .bg-particle {
            position: absolute;
            color: rgba(224, 109, 125, 0.12);
            font-size: 14px;
            animation: floatUp 6s linear infinite;
            pointer-events: none;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(100vh) scale(0.8);
                opacity: 0;
            }
            50% {
                opacity: 1;
            }
            100% {
                transform: translateY(-10vh) scale(1.2);
                opacity: 0;
            }
        }
    </style>
</head>
<body>

    <!-- Pantalla de inicio con el texto solicitado -->
    <div class="welcome-overlay" id="welcomeOverlay">
        <div style="font-size: 45px;">💌</div>
        <button class="start-btn" onclick="startExperience()">¡Atención, amore! Abre la carta</button>
    </div>

    <audio id="bgMusic">
        <source src="Goo Iris.mp3" type="audio/mp3">
    </audio>

    <div id="bg-animation"></div>

    <div class="player-container">
        <div class="song-header">Iris • Goo Goo Dolls</div>
        
        <!-- Línea de letra activa sincronizada -->
        <div class="lyrics-display" id="lyricsText">...</div>

        <div class="controls">
            <button class="control-btn" onclick="restartSong()">Reiniciar</button>
            <button class="control-btn active" id="playPauseBtn" onclick="togglePlay()">Pausar</button>
        </div>
    </div>

    <script>
        function createParticles() {
            const container = document.getElementById('bg-animation');
            setInterval(() => {
                const particle = document.createElement('div');
                particle.classList.add('bg-particle');
                particle.innerHTML = '♥';
                particle.style.left = Math.random() * 100 + 'vw';
                particle.style.animationDuration = (Math.random() * 3 + 4) + 's';
                container.appendChild(particle);

                setTimeout(() => {
                    particle.remove();
                }, 7000);
            }, 500);
        }
        createParticles();

        const music = document.getElementById('bgMusic');
        const playPauseBtn = document.getElementById('playPauseBtn');
        const lyricsText = document.getElementById('lyricsText');

        // Sincronización de tiempos (en segundos) con las líneas de la canción
        const lyricsData = [
            { time: 0, text: "🎵" },
            { time: 14, text: "And I'd give up forever to touch you" },
            { time: 21, text: "'Cause I know that you feel me somehow" },
            { time: 28, text: "'Cause you're closer to heaven than I'll ever be" },
            { time: 35, text: "And I don't want to go home right now" },
            { time: 44, text: "And all I can taste is this moment" },
            { time: 51, text: "'And all I can breathe is your life" },
            { time: 58, text: "'Cause sooner or later it's over" },
            { time: 65, text: "I just don't want to miss you tonight" }
        ];

        function startExperience() {
            const overlay = document.getElementById('welcomeOverlay');
            overlay.style.display = 'none';

            music.play().catch(err => console.log("Error de reproducción:", err));
        }

        // Actualización dinámica de las letras según el segundo del audio
        music.addEventListener('timeupdate', () => {
            const currentTime = music.currentTime;
            let currentLine = lyricsData[0].text;

            for (let i = 0; i < lyricsData.length; i++) {
                if (currentTime >= lyricsData[i].time) {
                    currentLine = lyricsData[i].text;
                }
            }
            lyricsText.textContent = currentLine;
        });

        function togglePlay() {
            if (music.paused) {
                music.play();
                playPauseBtn.textContent = "Pausar";
                playPauseBtn.classList.add('active');
            } else {
                music.pause();
                playPauseBtn.textContent = "Reproducir";
                playPauseBtn.classList.remove('active');
            }
        }

        function restartSong() {
            music.currentTime = 0;
            music.play();
            playPauseBtn.textContent = "Pausar";
            playPauseBtn.classList.add('active');
        }
    </script>
</body>
</html>
