<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iris - Goo Goo Dolls</title>
    <style>
        :root {
            --bg-color: #0b0709;
            --card-bg: #160d12;
            --primary-pink: #e06d7d;
            --soft-pink: #f7cbd0;
            --text-main: #fcf8f2;
            --text-muted: #9c8a90;
            --glow-color: rgba(224, 109, 125, 0.35);
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            background-image: radial-gradient(circle at center, #1f1018 0%, var(--bg-color) 100%);
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            position: relative;
            color: var(--text-main);
            user-select: none;
        }

        /* Pantalla de inicio con el botón solicitado */
        .welcome-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--bg-color);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            gap: 25px;
        }

        .start-btn {
            background-color: var(--primary-pink);
            color: white;
            border: 2px solid var(--soft-pink);
            padding: 16px 32px;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            font-size: 16px;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 0 25px var(--glow-color);
            transition: all 0.3s ease;
        }

        .start-btn:hover {
            background-color: #c95a6b;
            transform: scale(1.05);
            box-shadow: 0 0 35px var(--glow-color);
        }

        /* Contenedor principal estilo reproductor estético */
        .player-container {
            background-color: var(--card-bg);
            border: 1px solid rgba(224, 109, 125, 0.2);
            border-radius: 20px;
            width: 90%;
            max-width: 550px;
            padding: 40px 30px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.6), 0 0 20px rgba(224, 109, 125, 0.1);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
            z-index: 2;
            backdrop-filter: blur(10px);
        }

        .song-header {
            font-size: 12px;
            letter-spacing: 4px;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        /* Letras dinámicas con efecto de transición suave */
        .lyrics-display {
            font-size: 24px;
            font-weight: bold;
            color: var(--text-main);
            min-height: 90px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            line-height: 1.5;
            padding: 0 15px;
            text-shadow: 0 0 15px rgba(247, 203, 208, 0.3);
            opacity: 1;
            transition: opacity 0.35s ease, transform 0.35s ease;
        }

        .lyrics-display.fade-out {
            opacity: 0;
            transform: translateY(-8px);
        }

        /* Controles de reproducción */
        .controls {
            display: flex;
            gap: 15px;
            justify-content: center;
            width: 100%;
        }

        .control-btn {
            background: #25141d;
            border: 1px solid rgba(224, 109, 125, 0.3);
            color: white;
            padding: 10px 22px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 13px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .control-btn:hover {
            background: #381f2c;
            border-color: var(--primary-pink);
        }

        .control-btn.active {
            background: var(--primary-pink);
            border-color: var(--primary-pink);
            box-shadow: 0 0 15px var(--glow-color);
        }

        /* Partículas de fondo románticas */
        .bg-particle {
            position: absolute;
            color: rgba(224, 109, 125, 0.25);
            font-size: 16px;
            animation: floatUp 7s linear infinite;
            pointer-events: none;
            text-shadow: 0 0 8px var(--glow-color);
        }

        @keyframes floatUp {
            0% {
                transform: translateY(105vh) scale(0.6);
                opacity: 0;
            }
            30% {
                opacity: 0.8;
            }
            70% {
                opacity: 0.8;
            }
            100% {
                transform: translateY(-10vh) scale(1.3);
                opacity: 0;
            }
        }
    </style>
</head>
<body>

    <!-- Pantalla inicial con el texto solicitado -->
    <div class="welcome-overlay" id="welcomeOverlay">
        <div style="font-size: 50px;">💌</div>
        <button class="start-btn" onclick="startExperience()">¡Atención, amore! Abre la carta</button>
    </div>

    <audio id="bgMusic">
        <source src="Goo Iris.mp3" type="audio/mp3">
    </audio>

    <div id="bg-animation"></div>

    <div class="player-container">
        <div class="song-header">Iris • Goo Goo Dolls</div>
        
        <!-- Línea de letra activa sincronizada -->
        <div class="lyrics-display" id="lyricsText">...</div>

        <div class="controls">
            <button class="control-btn" onclick="restartSong()">Reiniciar</button>
            <button class="control-btn active" id="playPauseBtn" onclick="togglePlay()">Pausar</button>
        </div>
    </div>

    <script>
        function createParticles() {
            const container = document.getElementById('bg-animation');
            setInterval(() => {
                const particle = document.createElement('div');
                particle.classList.add('bg-particle');
                particle.innerHTML = '♥';
                particle.style.left = Math.random() * 100 + 'vw';
                particle.style.animationDuration = (Math.random() * 3 + 5) + 's';
                particle.style.fontSize = (Math.random() * 10 + 12) + 'px';
                container.appendChild(particle);

                setTimeout(() => {
                    particle.remove();
                }, 8000);
            }, 400);
        }
        createParticles();

        const music = document.getElementById('bgMusic');
        const playPauseBtn = document.getElementById('playPauseBtn');
        const lyricsText = document.getElementById('lyricsText');

        // Sincronización de tiempos y letras
        const lyricsData = [
            { time: 0, text: "🎵" },
            { time: 14, text: "And I'd give up forever to touch you" },
            { time: 21, text: "'Cause I know that you feel me somehow" },
            { time: 28, text: "'Cause you're closer to heaven than I'll ever be" },
            { time: 35, text: "And I don't want to go home right now" },
            { time: 44, text: "And all I can taste is this moment" },
            { time: 51, text: "And all I can breathe is your life" },
            { time: 58, text: "'Cause sooner or later it's over" },
            { time: 65, text: "I just don't want to miss you tonight" }
        ];

        let lastLineIndex = -1;

        function startExperience() {
            const overlay = document.getElementById('welcomeOverlay');
            overlay.style.display = 'none';

            music.play().catch(err => console.log("Error de reproducción:", err));
        }

        // Lógica de actualización sincronizada con efecto visual de desvanecimiento
        music.addEventListener('timeupdate', () => {
            const currentTime = music.currentTime;
            let activeIndex = 0;

            for (let i = 0; i < lyricsData.length; i++) {
                if (currentTime >= lyricsData[i].time) {
                    activeIndex = i;
                }
            }

            if (activeIndex !== lastLineIndex) {
                lastLineIndex = activeIndex;
                
                // Efecto de salida (fade-out)
                lyricsText.classList.add('fade-out');
                
                setTimeout(() => {
                    lyricsText.textContent = lyricsData[activeIndex].text;
                    // Efecto de entrada (fade-in)
                    lyricsText.classList.remove('fade-out');
                }, 200);
            }
        });

        function togglePlay() {
            if (music.paused) {
                music.play();
                playPauseBtn.textContent = "Pausar";
                playPauseBtn.classList.add('active');
            } else {
                music.pause();
                playPauseBtn.textContent = "Reproducir";
                playPauseBtn.classList.remove('active');
            }
        }

        function restartSong() {
            music.currentTime = 0;
            music.play();
            playPauseBtn.textContent = "Pausar";
            playPauseBtn.classList.add('active');
        }
    </script>
</body>
</html>
